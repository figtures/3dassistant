name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
        continue-on-error: true
      - run: npm run test:bridge-discovery
      - run: npm run test:bridge-creality-lan
      - run: npm run test:bridge-vendors
      - run: npm run test:bridge-detect-platform
      - run: npm run test:bridge-lan-host
      - run: npm run test:bridge-camera

  bridge-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/printflow-bridge/go.sum
      - name: Go test (printflow-bridge)
        working-directory: apps/printflow-bridge
        run: go test ./...
